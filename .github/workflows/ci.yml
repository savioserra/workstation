name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # the check matrix: the identity gate, the history-prose gate, the shell
  # syntax and ShellCheck gates, the format gate, the launcher shim's
  # dispatch gate (a stub nix), the nix eval read gate and the whitespace
  # gate. The gate tools come from the flake's lock, so the job installs
  # nix: the battery, the CI job and the docker lane run the same
  # ShellCheck and nixfmt.
  battery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16

      - name: Run the check matrix
        shell: bash
        run: sh .github/scripts/check.sh

  # the canonical validation entry: `nix flake check` — the flake's checks
  # output (the declared-state reads, every host leg's eval, and the
  # container E2E lane's staging — the runnable entry plus the flake source
  # it mounts). The binary cache owns the closure builds.
  flake-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16

      - name: nix flake check (the eval gates + the container lane's staging)
        shell: bash
        run: nix flake check --print-build-logs

  # the behavioral lane: the container E2E — the check's staged entry run
  # on a docker host (the hosted runners carry docker). The persona home
  # plane activates in a throwaway nixos/nix container: the consumer
  # smokes (the nvim headless boot with the languages
  # composed, the lazy-lock merge, the theme tokens), the selection
  # removal, the apply-driven switch and the receipt. The system plane keeps its
  # eval gate (the toplevel drvPath above — it never needed a boot).
  container-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16

      - name: The container E2E (the check's staged entry)
        shell: bash
        run: |
          nix build --print-build-logs .#checks.x86_64-linux.container-e2e
          ./result/bin/run-container-e2e
