# The tmux config: the multiplexer settings, the tmux2k status bar and
# the theme pick's colors.

# Keep terminal input responsive inside Neovim and other interactive programs.
set -sg escape-time 10

# The UTF-8 server env: panes and popups started from bare shells (ssh
# commands, launchers) inherit this, so pagers render multibyte glyphs
# instead of hex bytes.
set-environment -g LANG 'C.UTF-8'
set-environment -g LC_ALL 'C.UTF-8'

# Pass focus changes through to applications running inside tmux.
set -g focus-events on

# Enable mouse selection, scrolling, pane selection, and resizing.
set -g mouse on

# scroll-on-clear off: full-screen clears repaint in place — limited
# mobile clients (Termius/iOS) render scroll-style output as stacked lines.
# Version-guarded: releases without the option still parse.
%if "#{>=:#{version},3.5}"
set -g scroll-on-clear off
%endif

# Keep the status bar at tmux's traditional bottom edge, even after sourcing
# desktop/distribution configs that moved it.
set -g status-position bottom

# Pane labels on every pane's top border, built on tmux's default: index
# (reversed when active), the pane's terminal title — hermes shows the
# current topic there — then running command and directory; with the mouse
# on, the default's float, zoom and close buttons anchor right.
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[reverse],}#{pane_index}#[default] "#{pane_title}" #{pane_current_command} #{b:pane_current_path}#{?#{mouse},#[align=right]#[range=control|7][#{?#{pane_floating_flag},t,f}]#[norange]#[range=control|8][#{?#{window_zoomed_flag},u,z}]#[norange]#[range=control|9][x]#[norange],}'

# Rounded popup and menu borders; their colors follow the theme pick.
set -g popup-border-lines rounded
set -g menu-border-lines rounded

# Advertise modern color support inside tmux.
set -g default-terminal "tmux-256color"
set -s terminal-features[100] "xterm-256color:RGB"

# Cycle windows using Shift + Arrow keys (no prefix needed).
bind -n S-Left previous-window
bind -n S-Right next-window

# tmux2k status bar — onedark theme, cpu/ram on the right; clicking cpu/ram
# opens btop.
#   - `dark_blue` = `default`: the window background slots become bg=default
#   - the window separator glyphs are empty; module segments keep upstream pills
set -g @tmux2k-theme 'onedark'
set -g @tmux2k-bg-main 'default'
set -g @tmux2k-bg-alt 'default'
set -g @tmux2k-dark-blue 'default'
set -g @tmux2k-white '#5c6370'
set -g @tmux2k-window-list-colors 'blue dark_blue'
set -g @tmux2k-window-list-left-sep ''
set -g @tmux2k-window-list-right-sep ''
set -g @tmux2k-right-plugins 'cpu ram time'
set -g @tmux2k-ram-popup-cmd 'btop'
# git segment click: lazygit (branch panel) in a popup, through tmux2k's
# @tmux2k-<plugin>-popup-cmd hook. lazygit resolves via ~/.local/bin.
set -g @tmux2k-git-popup-cmd 'lazygit branch'
set -g @tmux2k-time-format '%a %H:%M'

# The workstation theme pick: tmux2k colors, pane canvas (light themes),
# borders and messages over the onedark fallback above
# (workstation theme <name>; docs/theme.md).
source-file -q ~/.local/state/workstation/theme/current/tmux.conf

# tmux2k renders the status bar from the options above: the plugin rides a
# pinned checkout (no plugin manager — the substrate provisions it).
run-shell '~/.tmux/plugins/tmux2k/2k.tmux'
